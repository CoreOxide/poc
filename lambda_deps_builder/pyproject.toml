[tool.poetry]
name = "lambda-deps-builder"
version = "0.2.0"
description = "CDK construct that builds Python Lambda dependencies inside Lambda — no local Docker."
authors = ["Alexy Grabov <alexy.grabov@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/CoreOxide/poc"
homepage = "https://github.com/CoreOxide/poc/tree/main/lambda_deps_builder"
keywords = ["aws", "cdk", "lambda", "dependencies", "dockerless", "layer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
packages = [{ include = "lambda_deps_builder" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
aws-cdk-lib = ">=2.150.0"
constructs = ">=10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
boto3 = "^1.34.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: deploys real AWS resources via cdk; opt in via `pytest -m e2e`",
]
